name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (vX.Y.Z). It has to exist on the remote.
        required: true
        type: string

# A tag push names the tag in `github.ref_name`. A manual run starts from a branch, so there
# the tag comes from the input. Every step that names the tag reads this variable.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      # `tests/bench-fixtures.test.ts` needs every commit named in
      # `bench/history/pages.jsonl`. A shallow clone does not have those objects.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check the tag against package.json
        run: node scripts/release/cli.ts check --tag "$RELEASE_TAG"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - id: playwright
        shell: bash
        run: echo "key=playwright-chromium-${RUNNER_OS}-${ImageOS:-unknown}-$(sha256sum pnpm-lock.yaml | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}

      # Invariant: same recipe as CI. Browser only, never `--with-deps`.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_SKIP_INSTALL: '1'

  package:
    name: Package
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: ./.github/actions/package-extension
        with:
          from-source: true

      - name: Check the packaged manifest version
        run: node scripts/release/cli.ts check --manifest .output/chrome-mv3/manifest.json --tag "$RELEASE_TAG"

  release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: chrome-mv3-zip
          path: store-zip

      - name: Collect the store zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find store-zip -type f -name '*.zip' | sort)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected one store zip, found ${#zips[@]}" >&2
            exit 1
          fi
          mkdir -p dist-zip
          cp -- "${zips[0]}" dist-zip/

      - name: Read the changelog section
        run: node scripts/release/cli.ts notes --tag "$RELEASE_TAG" > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: dist-zip/*.zip
          fail_on_unmatched_files: true
